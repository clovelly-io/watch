[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clovelly-watch-runner"
version = "0.1.0"
description = "Clovelly Watch's runner: GitHub's webhooks, jobs claimed from Watch, each run in a sandbox of your own environment"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["cryptography==45.0.7"]

[project.optional-dependencies]
# The published sandbox SDK, which `serve`, `setup`, `template build` and `check` drive. The
# base image installs the runner without it (the harness needs only the schemas).
sandbox = ["clovelly @ https://github.com/clovelly-io/clovelly/archive/refs/tags/v0.6.0.tar.gz#subdirectory=sdks/python"]

[project.scripts]
clovelly-watch-runner = "clovelly_watch_runner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
