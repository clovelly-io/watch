[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clovelly-watch"
version = "0.1.0"
description = "Clovelly Watch for Python: one line sends the telemetry Watch's monitors need, with payloads sealed to your key"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# Exact pins, checked by check_licences.py. OpenTelemetry's API and SDK depend on
# typing-extensions, which is PSF-2.0 and outside the licence allowlist: see README.md
# "Licences".
dependencies = [
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-proto==1.45.2",
    "opentelemetry-exporter-otlp-proto-common==1.45.2",
    "opentelemetry-instrumentation==0.66b2",
    "opentelemetry-instrumentation-fastapi==0.66b2",
    "opentelemetry-instrumentation-django==0.66b2",
    "opentelemetry-instrumentation-flask==0.66b2",
    "opentelemetry-instrumentation-requests==0.66b2",
    "opentelemetry-instrumentation-httpx==0.66b2",
    "opentelemetry-instrumentation-psycopg==0.66b2",
    "opentelemetry-instrumentation-sqlalchemy==0.66b2",
    "cryptography==45.0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
